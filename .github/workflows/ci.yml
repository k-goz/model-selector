name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Python regression tests
        run: python -m pytest tests/ -q

      - name: Validate committed artifacts
        run: |
          python scripts/validate_catalog_schema.py
          python validate_data.py --max-age-hours 10000
          python verify_ground_truth.py
          python validate_site.py

      - name: Run browser regression tests
        run: npm run test:browser
