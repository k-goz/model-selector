name: Update Model Data

on:
  schedule:
    # 每天北京时间 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  # 同一工作流版本保持串行；新版本不被 GitHub 故障遗留的旧队列永久锁死。
  group: update-model-data-${{ github.workflow_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          npm ci

      - name: Restore model API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: model-api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            model-api-cache-${{ runner.os }}-

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Generate fresh data and site
        env:
          OUTPUT_FILE: index.html
          CACHE_DIR: .cache
          SF_KEY: ${{ secrets.SF_KEY }}
          ALIYUN_KEY: ${{ secrets.ALIYUN_KEY }}
          MS_KEY: ${{ secrets.MS_KEY }}
          ZH_KEY: ${{ secrets.ZH_KEY }}
          VOLC_KEY: ${{ secrets.VOLC_KEY }}
          TENCENT_KEY: ${{ secrets.TENCENT_KEY }}
          SPARK_KEY: ${{ secrets.SPARK_KEY }}
          MINIMAX_KEY: ${{ secrets.MINIMAX_KEY }}
          YI_KEY: ${{ secrets.YI_KEY }}
          BAICHUAN_KEY: ${{ secrets.BAICHUAN_KEY }}
          JIEYUE_KEY: ${{ secrets.JIEYUE_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          BAIDU_KEY: ${{ secrets.BAIDU_KEY }}
          TOGETHER_KEY: ${{ secrets.TOGETHER_KEY }}
          FIREWORKS_KEY: ${{ secrets.FIREWORKS_KEY }}
          COHERE_KEY: ${{ secrets.COHERE_KEY }}
          INFINI_KEY: ${{ secrets.INFINI_KEY }}
          NOVITA_KEY: ${{ secrets.NOVITA_KEY }}
          DEEPINFRA_KEY: ${{ secrets.DEEPINFRA_KEY }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          N1N_KEY: ${{ secrets.N1N_KEY }}
          CA_KEY: ${{ secrets.CA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate.py --refresh

      - name: Validate published data
        run: |
          python validate_data.py \
            --max-age-hours 2 \
            --min-models 1000 \
            --min-live-ratio 0.65 \
            --max-fallback-ratio 0.35

      - name: Verify ground truth prices
        run: python verify_ground_truth.py

      - name: Validate generated pages
        run: python validate_site.py

      - name: Run browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- index.html en/index.html models_data.json ping_analysis.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html models_data.json ping_analysis.json
          git commit -m "auto: update model data $(date +%Y-%m-%d)"
          git push

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_ci_failure.py

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-model-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ground_truth_report.json
            output/playwright/
            models_data.json
            ping_analysis.json
