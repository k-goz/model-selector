name: Refresh Model Data

on:
  schedule:
    # 每天北京时间 06:00；schedule 只存在于默认分支的生产入口。
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 使用新的稳定组绕开 2026-08-12 遗留的幽灵 queued runs。
  group: production-model-data-refresh-v2
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/update-models.yml
    secrets: inherit
