name: Deployment Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check production origins
        run: |
          python check_deployment.py \
            --base-url https://ai-model-selector-eight.vercel.app \
            --base-url https://model.ai-selector.top \
            --max-age-hours 48

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_ci_failure.py
